; 복사해서 config.ini 로 쓴다. 비밀번호는 파일에 쓰지 말고 환경 변수로 준다.
[store]                       ; 수집 결과 저장소 (schema.sql 적용)
host = 127.0.0.1
port = 3306
user = slowq_store
database = slowq
password_env = SLOWQ_STORE_PASSWORD

[target]                      ; 수집 대상 클러스터 공통 계정 (performance_schema SELECT 만)
user = slowq_collector
password_env = SLOWQ_TARGET_PASSWORD

[verify]                      ; 실측 검증 DB (운영 아님: 복제본 · 스냅숏 복원)
host = 127.0.0.1
port = 3307
user = slowq_verify
database = shop
password_env = SLOWQ_VERIFY_PASSWORD

[rules]
min_sec = 0.5                 ; 운영 기준 (실습 PC 는 0.2)
min_q = 30                    ; 운영 기준 (실습 PC 는 5)
worse_ratio = 2.0
spike_ratio = 2.0
spike_min_total = 1.0
top_n = 10                    ; 하루 발행 상한
